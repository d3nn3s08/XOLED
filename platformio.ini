; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
data_dir = ./data
default_envs = esp32dev

[env]
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  fastled/FastLED@3.9.20
  bblanchon/ArduinoJson@^7.0.4
  ESP32Async/AsyncTCP@^3.5.0
  ESP32Async/ESPAsyncWebServer@^3.12.1
  jnthas/Improv WiFi Library@^0.0.4

[env:esp32dev]
board = esp32dev
board_build.partitions = partitions_esp32.csv
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
build_flags = -g
monitor_filters = esp32_exception_decoder

[env:esp32c3dev]
board = esp32-c3-devkitm-1
board_build.partitions = partitions_esp32.csv
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
build_flags = -g
  -DARDUINO_USB_MODE=1 ;; this flag is mandatory for ESP32-C3
  -DARDUINO_USB_CDC_ON_BOOT=1
monitor_filters =
  esp32_exception_decoder
  debug
  printable
  colorize
